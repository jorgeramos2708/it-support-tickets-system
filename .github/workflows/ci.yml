name: CI

on: [push, pull_request]

jobs:
  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - incidents
          - problems
          - changes
          - cmdb
          - kb
          - notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compilar servicio
        working-directory: services/${{ matrix.service }}
        shell: bash
        run: |
          npm install
          npm run build
          npm test

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probar y compilar frontend
        working-directory: frontend
        shell: bash
        run: |
          npm install
          npm run test
          npm run lint
          npm run build

  e2e:
    name: E2E del stack (compose)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Levantar el stack completo
        shell: bash
        run: docker compose up -d --build
      - name: Esperar salud de los servicios
        shell: bash
        run: node scripts/wait-healthy.mjs 300000
      - name: Smoke E2E
        shell: bash
        run: node scripts/e2e-smoke.mjs
      - name: Logs al fallar
        if: failure()
        shell: bash
        run: docker compose logs --tail 40

  publish:
    name: Publicar imagenes (opcional)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Construir y publicar al registry
        shell: bash
        run: node scripts/publish.mjs
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
