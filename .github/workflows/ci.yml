name: CI

on: [push, pull_request]

jobs:
  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - incidents
          - problems
          - changes
          - cmdb
          - kb
          - notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compilar servicio
        working-directory: services/${{ matrix.service }}
        shell: bash
        run: |
          npm install
          npm run build
          npm test

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probar y compilar frontend
        working-directory: frontend
        shell: bash
        run: |
          npm install
          npm run test
          npm run lint
          npm run build

  e2e:
    name: E2E del stack (compose)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Levantar el stack completo (gateway HTTP para CI)
        shell: bash
        run: |
          docker network create caddy_net 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Verificar stack
        shell: bash
        run: |
          echo "Node: $(node --version)"
          echo "--- docker compose ps ---"
          docker compose ps --format "table {{.Name}}\t{{.Status}}" || true
          echo "--- probando gateway ---"
          curl -s http://127.0.0.1/api/incidents/health || echo "gateway no responde"
          echo ""
      - name: Esperar salud de los servicios
        shell: bash
        run: |
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            all_healthy=true
            for svc in auth incidents problems changes cmdb kb notifications; do
              if ! curl -sf "http://127.0.0.1/api/$svc/health" > /dev/null 2>&1; then
                all_healthy=false
                echo "Esperando: $svc (elapsed=${elapsed}s)"
                break
              fi
            done
            if [ "$all_healthy" = true ]; then
              echo "Todos los servicios saludables (${elapsed}s)"
              exit 0
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "Timeout tras ${timeout}s"
          exit 1
      - name: Smoke E2E
        shell: bash
        run: node scripts/e2e-smoke.mjs
      - name: Logs al fallar
        if: failure()
        shell: bash
        run: docker compose logs --tail 40

  publish:
    name: Publicar a Zot registry
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Verificar conectividad al registry
        shell: bash
        run: |
          echo "Verificando registry.edrs.xyz..."
          curl -sf https://registry.edrs.xyz/v2/ && echo "Registry accesible" || echo "Registry NO accesible"
          curl -sf https://registry.edrs.xyz/v2/_catalog && echo "Catalog OK" || echo "Catalog NO accesible"
      - name: Construir y publicar a registry.edrs.xyz
        shell: bash
        run: node scripts/publish.mjs
        env:
          ZOT_REGISTRY: registry.edrs.xyz
          ZOT_CI_USER: ${{ secrets.ZOT_CI_USER }}
          ZOT_CI_PASSWORD: ${{ secrets.ZOT_CI_PASSWORD }}

  deploy:
    name: Deploy a produccion
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '2222' }}
          command_timeout: 20m
          script: |
            set -e
            echo "=== TickITFlow deploy ==="

            DEPLOY_DIR=/opt/tickitflow

            # Clonar si no existe
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Clonando repo en $DEPLOY_DIR..."
              git clone https://github.com/jorgeramos2708/tickitflow.git "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            echo "Directorio: $(pwd)"

            # Asegurar que el remote apunta al repo renombrado
            git remote set-url origin https://github.com/jorgeramos2708/tickitflow.git

            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env -e certs/ -e docker-compose.override.yml
            echo "Git: $(git log --oneline -1)"

            # Override de red: conectar a caddy_net del host
            cat > docker-compose.override.yml << 'OVR'
            networks:
              default:
                name: caddy_net
                external: true
            OVR

            docker compose version
            echo "--- build ---"
            docker compose build 2>&1 | tail -5
            echo "--- up ---"
            docker compose up -d 2>&1 | tail -5

            echo "--- health check ---"
            DOMAIN=tickitflow.edrs.xyz
            MAX_WAIT=120
            elapsed=0
            while [ $elapsed -lt $MAX_WAIT ]; do
              all_ok=true
              for svc in auth incidents problems changes cmdb kb notifications; do
                if ! curl -sf "https://$DOMAIN/api/$svc/health" > /dev/null 2>&1; then
                  all_ok=false
                  break
                fi
              done
              if [ "$all_ok" = true ]; then
                echo "Todos los servicios saludables (${elapsed}s)"
                echo "=== DEPLOY EXITOSO ==="
                exit 0
              fi
              echo "Esperando... ${elapsed}s"
              sleep 10
              elapsed=$((elapsed + 10))
            done

            echo "=== TIMEOUT ==="
            docker compose ps
            exit 1
