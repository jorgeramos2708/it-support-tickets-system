global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tickitflow
    static_configs:
      - targets:
          - auth:4001
          - incidents:4003
          - problems:4005
          - changes:4006
          - cmdb:4007
          - kb:4008
          - notifications:4009
        labels:
          stack: tickitflow
    # incidents expone Prometheus en /prom (su /metrics es la serie diaria ITIL con JWT)
    relabel_configs:
      - source_labels: [__address__]
        regex: incidents:4003
        target_label: __metrics_path__
        replacement: /prom
        action: replace
      - source_labels: [__address__]
        regex: incidents:4003
        target_label: instance
        replacement: incidents
